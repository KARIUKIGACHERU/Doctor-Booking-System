    <header class="header">
      <div class="header-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <h1>Book &amp; manage appointments</h1>

      </div>

    <section>
      <div class="section-inner">
        <div class="booking-select-card">

          </p>
          <div class="field-row">
            <div class="field">
              <label for="booking-doctor-select">Doctor</label>
              <select id="booking-doctor-select"></select>
            </div>
            <button class="btn btn-primary" id="booking-open-btn">Choose Date &amp; Time</button>
          </div>
        </div>
