<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search doctors by specialty, hospital, location, and fee." />
    <meta name="author" content="Afya kwa wote" />
    <link rel="stylesheet" href="style.css" />
    <title>Find a Doctor — Afya kwa wote</title>
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z" />
              <path d="M9 10h6M12 7v6" />
            </svg>
          </span>
          Afya kwa wote
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="index.html">Home</a>
          <a href="doctors.html" class="active">Find Doctors</a>
          <a href="booking.html">My Appointments</a>
        </nav>
      </div>
    </header>

    <main>
    <div class="page-head">
      <div class="section-inner">
        <h1>Find a doctor</h1>
        <p>Search and filter by specialty, hospital, and fee to find the right fit.</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="toolbar-inner">
        <div class="toolbar-search">
          <input
            type="search"
            id="doctor-search"
            placeholder="Search by doctor name or specialty…"
            aria-label="Search doctors"
          />
        </div>
        <div class="toolbar-row">
          <div class="filter-chips" id="specialty-chips" aria-label="Filter by specialty"></div>
          <select id="hospital-filter" aria-label="Filter by hospital"></select>
          <select id="sort-filter" aria-label="Sort results">
            <option value="rating">Sort: Top rated</option>
            <option value="fee-low">Sort: Fee (low to high)</option>
            <option value="fee-high">Sort: Fee (high to low)</option>
          </select>
        </div>
    </div>
